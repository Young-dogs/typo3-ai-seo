<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module"/>

<f:section name="Before">
    <f:if condition="{configJson}">
        <f:asset.module identifier="@youngdogs/ai-seo/ai-seo-news.js"/>
    </f:if>
</f:section>

<f:section name="Content">

    <f:if condition="!{hasAccess}">
        <f:then>
            <f:be.infobox
                message="{f:translate(key: 'LLL:EXT:youngdogs_ai_seo/Resources/Private/Language/locallang_news.xlf:info.noAccess')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
            />
        </f:then>
        <f:else>
            <f:if condition="{pageUid} == 0">
                <f:then>
                    <f:be.infobox
                        message="{f:translate(key: 'LLL:EXT:youngdogs_ai_seo/Resources/Private/Language/locallang_news.xlf:info.noPageSelected')}"
                        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
                    />
                </f:then>
                <f:else>
                    <f:if condition="{configJson}">
                        <div id="ai-news-config" hidden data-config="{configJson -> f:format.htmlspecialchars()}"></div>
                    </f:if>

                    <form action="{f:be.uri(route: 'youngdogs_ai_seo_news', parameters: '{id: pageUid}')}" method="post">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="lang">
                                    <f:translate key="LLL:EXT:youngdogs_ai_seo/Resources/Private/Language/locallang_news.xlf:selector.language"/>
                                </label>
                                <f:render partial="DropdownMenu" arguments="{name: 'lang', id: 'lang', options: langDropdownOptions, currentValue: langDropdownCurrentValue}"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="depth">
                                    <f:translate key="LLL:EXT:youngdogs_ai_seo/Resources/Private/Language/locallang_news.xlf:selector.depth"/>
                                </label>
                                <f:render partial="DropdownMenu" arguments="{name: 'depth', id: 'depth', options: depthDropdownOptions, currentValue: depthDropdownCurrentValue}"/>
                            </div>
                        </div>
                    </form>

                    <f:if condition="{newsRecords}">
                        <f:then>
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th></th>
                                            <th><f:translate key="LLL:EXT:youngdogs_ai_seo/Resources/Private/Language/locallang_news.xlf:column.title"/></th>
                                            <th><f:translate key="LLL:EXT:youngdogs_ai_seo/Resources/Private/Language/locallang_news.xlf:column.date"/></th>
                                            <th><f:translate key="LLL:EXT:youngdogs_ai_seo/Resources/Private/Language/locallang_news.xlf:column.status"/></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <f:for each="{newsRecords}" as="news">
                                            <tr data-uid="{news.uid}">
                                                <td class="col-btn nowrap">
                                                    <div class="btn-group btn-group-sm">
                                                        <a href="{news.editUrl}" class="btn btn-default" title="Edit record">
                                                            <typo3-backend-icon identifier="actions-open" size="small"></typo3-backend-icon>
                                                        </a>
                                                    </div>
                                                </td>
                                                <td><a href="{news.editUrl}">{news.title}</a></td>
                                                <td>
                                                    <f:if condition="{news.datetime}">
                                                        <f:format.date format="Y-m-d">{news.datetime}</f:format.date>
                                                    </f:if>
                                                </td>
                                                <td>
                                                    <f:if condition="{news.hidden}">
                                                        <span class="badge bg-secondary">
                                                            <f:translate key="LLL:EXT:youngdogs_ai_seo/Resources/Private/Language/locallang_news.xlf:status.hidden"/>
                                                        </span>
                                                    </f:if>
                                                </td>
                                            </tr>
                                        </f:for>
                                    </tbody>
                                </table>
                            </div>
                        </f:then>
                        <f:else>
                            <f:be.infobox
                                message="{f:translate(key: 'LLL:EXT:youngdogs_ai_seo/Resources/Private/Language/locallang_news.xlf:info.noNews')}"
                                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::NOTICE')}"
                            />
                        </f:else>
                    </f:if>
                </f:else>
            </f:if>
        </f:else>
    </f:if>

</f:section>

</html>
